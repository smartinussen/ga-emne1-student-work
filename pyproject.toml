[project]
name = "ga-modul1"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "mysql-connector-python>=26.10.0",
    "nicegui>=3.16.0",
    "ty>=0.0.99",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]   # line length is the formatter's job
